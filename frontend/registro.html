<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sano y Salvo</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input { width: 100%; margin-bottom: 1rem; padding: 0.5rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.7rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .link { text-align: center; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Crear Cuenta</h2>
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="text" id="rut" placeholder="RUT (sin puntos ni guion)">
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="registrar()">Registrar</button>
        <div class="link">
            <a href="index.html">¿Ya tienes cuenta? Loguéate</a>
        </div>
    </div>

    <script>
        async function registrar() {
            const data = {
                nombre: document.getElementById('nombre').value,
                rut: document.getElementById('rut').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rol: "USER"
            };

            try {
                // Se agrega /registro al final de la URL
                const response = await fetch('http://localhost:8080/api/usuarios/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('¡Usuario registrado con éxito! Ahora puedes loguearte.');
                    window.location.href = 'index.html';
                } else {
                    const err = await response.text();
                    alert('Error al registrar: ' + err);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('No se pudo conectar con el servidor.');
            }
        }
    </script>
</body>
</html>
